<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Skyora</title>

  <meta
    name="description"
    content="Skyora — simple, beautiful weather forecasts and alerts."
  >

  <meta
    name="theme-color"
    content="#172554"
  >

  <!-- Android / PWA -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Skyora"
  >

  <!-- PWA Manifest -->
  <link
    rel="manifest"
    href="manifest.json"
  >

  <!-- App Icons -->
  <link
    rel="icon"
    type="image/png"
    href="skyora-icon.png"
  >

  <link
    rel="apple-touch-icon"
    href="skyora-icon.png"
  >

  <!-- Skyora Styles -->
  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <main class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

      <div>
        <p class="eyebrow">SKYORA</p>
        <h1>Weather</h1>
      </div>

      <div class="header-actions">

        <!-- Temperature Unit -->
        <button
          id="unitToggle"
          class="unit-button"
          type="button"
          aria-label="Change temperature unit"
        >
          °F
        </button>

        <!-- Dark Mode -->
        <button
          id="themeToggle"
          class="theme-toggle"
          type="button"
          aria-label="Toggle dark mode"
          title="Toggle dark mode"
        ></button>

      </div>

    </header>


    <!-- =========================
         SEARCH
    ========================== -->

    <section class="search-section">

      <form id="searchForm">

        <input
          id="cityInput"
          type="search"
          placeholder="Search for a city..."
          autocomplete="off"
          aria-label="Search for a city"
        >

        <button type="submit">
          Search
        </button>

      </form>

      <p
        id="status"
        class="status"
        aria-live="polite"
      ></p>

    </section>


    <!-- =========================
         SKYORA ALERTS
    ========================== -->

    <section
      id="alertBox"
      class="alert-box"
      hidden
      aria-live="assertive"
    >

      <div class="alert-header">

        <div
          class="alert-icon"
          id="alertIcon"
        >
          ⚠️
        </div>

        <div class="alert-heading">

          <p class="alert-label">
            SKYORA ALERT
          </p>

          <h2 id="alertTitle">
            Weather Alert
          </h2>

        </div>

      </div>


      <div class="alert-content">

        <p id="alertDescription"></p>

        <div class="alert-details">

          <p>
            <strong>Area:</strong>
            <span id="alertArea">—</span>
          </p>

          <p>
            <strong>Expires:</strong>
            <span id="alertExpires">—</span>
          </p>

        </div>

      </div>


      <button
        id="dismissAlert"
        class="dismiss-alert"
        type="button"
      >
        Acknowledge
      </button>

    </section>


    <!-- =========================
         CURRENT WEATHER
    ========================== -->

    <section class="current-card">

      <div class="location">

        <h2 id="cityName">
          Syracuse
        </h2>

        <p id="dateText">
          Loading...
        </p>

      </div>


      <div class="current-weather">

        <div
          class="weather-icon"
          id="weatherIcon"
          aria-hidden="true"
        >
          ☁️
        </div>

        <div class="temperature">
          <span id="temperature">--</span>°
        </div>

        <div
          class="condition"
          id="condition"
        >
          Loading...
        </div>

      </div>


      <div class="weather-details">

        <div class="detail">
          <span>Feels like</span>
          <strong id="feelsLike">--°</strong>
        </div>

        <div class="detail">
          <span>Humidity</span>
          <strong id="humidity">--%</strong>
        </div>

        <div class="detail">
          <span>Wind</span>
          <strong id="wind">--</strong>
        </div>

        <div class="detail">
          <span>Rain chance</span>
          <strong id="rainChance">--%</strong>
        </div>

      </div>

    </section>


    <!-- =========================
         HOURLY FORECAST
    ========================== -->

    <section class="forecast-section">

      <div class="section-heading">
        <h2>Hourly</h2>
      </div>

      <div
        id="hourlyList"
        class="hourly-list"
      ></div>

    </section>


    <!-- =========================
         7-DAY FORECAST
    ========================== -->

    <section class="forecast-section">

      <div class="section-heading">
        <h2>7-Day Forecast</h2>
      </div>

      <div
        id="forecastList"
        class="forecast-list"
      ></div>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

      <p>
        Weather data from

        <a
          href="https://open-meteo.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Open-Meteo
        </a>

        and

        <a
          href="https://www.weather.gov/"
          target="_blank"
          rel="noopener noreferrer"
        >
          NWS
        </a>
      </p>

      <p class="footer-brand">
        Skyora ☁️
      </p>

    </footer>

  </main>


  <!-- =========================
       SKYORA ALERT SOUND
  ========================== -->

  <audio
    id="alertSound"
    src="skyora-noti.mp3"
    preload="auto"
  ></audio>


  <!-- =========================
       SKYORA APP
  ========================== -->

  <script src="app.js"></script>


  <!-- =========================
       PWA SERVICE WORKER
  ========================== -->

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js")
          .then(function () {
            console.log("Skyora service worker registered.");
          })
          .catch(function (error) {
            console.error(
              "Skyora service worker registration failed:",
              error
            );
          });
      });
    }
  </script>

</body>
</html>
